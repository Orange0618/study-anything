name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  npm-installer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - if: matrix.node-version == 22
        run: npm run pack:check
